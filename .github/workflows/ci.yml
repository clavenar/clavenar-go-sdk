name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core (go ${{ matrix.go }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.12', '1.23.12', '1.24.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated Go caches
        env:
          CACHE_VARIANT: ${{ matrix.go }}
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${CACHE_VARIANT//\//-}"
          install -d -m 0700 "$RUNNER_TEMP/gotmp-$suffix"
          echo "GOMODCACHE=$RUNNER_TEMP/gomod-$suffix" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache-$suffix" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/gotmp-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '${{ matrix.go }}'
          cache: false
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then echo "unformatted:"; echo "$files"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  adapters:
    name: adapter ${{ matrix.module }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [adapters/anthropic, adapters/openai]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated Go caches
        env:
          CACHE_VARIANT: ${{ matrix.module }}
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${CACHE_VARIANT//\//-}"
          install -d -m 0700 "$RUNNER_TEMP/gotmp-$suffix"
          echo "GOMODCACHE=$RUNNER_TEMP/gomod-$suffix" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache-$suffix" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/gotmp-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: false
      - working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -race -count=1 ./...

  examples:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated Go caches
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          install -d -m 0700 "$RUNNER_TEMP/gotmp-$suffix"
          echo "GOMODCACHE=$RUNNER_TEMP/gomod-$suffix" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache-$suffix" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/gotmp-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: false
      - working-directory: examples
        run: go build ./...

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated Go caches
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          install -d -m 0700 "$RUNNER_TEMP/gotmp-$suffix"
          echo "GOMODCACHE=$RUNNER_TEMP/gomod-$suffix" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache-$suffix" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/gotmp-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...
      - working-directory: adapters/anthropic
        run: golangci-lint run ./...
      - working-directory: adapters/openai
        run: golangci-lint run ./...

  vuln:
    name: govulncheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated Go caches
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          install -d -m 0700 "$RUNNER_TEMP/gotmp-$suffix"
          echo "GOMODCACHE=$RUNNER_TEMP/gomod-$suffix" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache-$suffix" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/gotmp-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Scan with the current patched toolchain while the core matrix
          # separately proves the older minimum-supported Go releases.
          go-version: '1.25.12'
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
      - working-directory: adapters/anthropic
        run: govulncheck ./...
      - working-directory: adapters/openai
        run: govulncheck ./...
